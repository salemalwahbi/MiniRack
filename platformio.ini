[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    rweather/Crypto
    rweather/CryptoLW
    https://github.com/sayacom/WireGuard-ESP32-Arduino.git#feature/esp-netif


; Same source tree, separate opt-in HOME-only experiment.
; Never select this environment until the Pi routing trial is prepared.
[env:esp32-s3-home-lab]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DMINIRACK_HOME_EGRESS_REQUIRED=1
    -DMINIRACK_HOME_TUNNEL_EXPERIMENT=1

# V1+V2 use ONE codebase and ONE normal firmware build.
# Once include/minirack_v2_private.h is provisioned locally, the ordinary
# esp32-s3-devkitc-1 build activates V2 authorization telemetry automatically.
# Without that header the original V1 behaviour remains (safe upgrade path).
# The optional V2 lab environment below forces enrollment validation.
[env:esp32-s3-v2-lab]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DMINIRACK_V2_CLIENT_ENABLED=1
